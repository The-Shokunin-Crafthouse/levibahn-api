# Secret scan (studio learning #321, spec 60 §10).
# Every PR: scan the commits the PR adds. Manual run: scan the full history.
# The binary is pinned by version and verified by SHA-256 before it runs (#131).
name: gitleaks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan the PR's commits
        if: github.event_name == 'pull_request'
        run: ./gitleaks git --redact --no-banner --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
      - name: Scan the full history
        if: github.event_name == 'workflow_dispatch'
        run: ./gitleaks git --redact --no-banner .
